; SISCO settings.
;
; You do not need to change anything in here. Everything is on by default, and that is
; how the mod is meant to run. Leave it alone unless something is wrong.
;
; If you report a problem, SISCO.log beside this file records which of these were on.
; Please send that log with your report.


[SISCO]

; Try this first. If the problem is still there with this set to 0, SISCO is not causing it.
; (The vulkan.dll from the download is not affected by this. Put your old one back to rule it out too.)
Enabled=1

; These are fixes for bugs in the game itself. They are the least likely thing to cause
; a problem and the most likely thing to be preventing one.
Fixes=1

; The bigger pools: drawable slots, list entries, the VehicleStruct pool, and the
; streaming arena. These are all set once, while the game starts.
Limits=1

; The streaming budget, the car and ped budgets, the brake that lowers them again if
; memory runs short, and the launch options SISCO sets for them at startup. Try this one
; first for slow loading, and for a game that runs badly or stops responding after a while.
Budget=1
